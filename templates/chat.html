<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src {{cspSource}} data: blob:; font-src {{cspSource}}; style-src {{cspSource}}; script-src 'nonce-{{nonce}}';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{{styleUri}}" />
    <title>Main Agent</title>
  </head>
  <body>
    <main class="chat-shell" aria-label="Main Agent 채팅">
      <section id="timeline" class="timeline" aria-live="polite" aria-label="대화 내용">
        <div id="empty-state" class="empty-state">
          <img class="brand-mark" src="{{iconUri}}" alt="" aria-hidden="true" />
          <h1>Agent Factory</h1>
          <p>이 탭은 하나의 독립된 Main Agent 세션입니다.</p>
        </div>
      </section>

      <div id="drop-overlay" class="drop-overlay" hidden>
        <strong>파일 또는 폴더를 놓아 첨부</strong>
      </div>

      <section class="composer-region" aria-label="메시지 작성">
        <div id="run-status" class="run-status" role="status" aria-live="polite" hidden>
          <span class="run-status-copy">
            <span id="run-status-label" class="run-status-label"></span>
            <span class="run-status-meta" aria-hidden="true">(<span id="run-elapsed">0s</span> · Esc로 중단)</span>
          </span>
        </div>
        <div id="attachment-list" class="attachment-list" aria-label="첨부 항목"></div>
        <div class="composer">
          <textarea
            id="prompt"
            rows="1"
            maxlength="100000"
            placeholder="Agent Factory에 요청하세요"
            aria-label="Main Agent에게 보낼 메시지"
          ></textarea>
          <div class="composer-actions">
            <div class="composer-actions-start">
              <button id="attach-button" class="icon-button" type="button" title="파일 또는 폴더 첨부" aria-label="파일 또는 폴더 첨부">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"></path></svg>
              </button>
              <div class="setting-control">
                <button id="model-button" class="setting-button" type="button" title="모델 선택" aria-label="모델 선택" aria-haspopup="menu" aria-expanded="false" aria-controls="model-menu">
                  <span id="model-label">Model</span>
                  <svg class="chevron-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="m4 6 4 4 4-4"></path></svg>
                </button>
                <div id="model-menu" class="setting-menu" role="menu" aria-label="모델 선택" hidden></div>
              </div>
              <div class="setting-control">
                <button id="reasoning-button" class="setting-button" type="button" title="추론 수준 선택" aria-label="추론 수준 선택" aria-haspopup="menu" aria-expanded="false" aria-controls="reasoning-menu">
                  <span id="reasoning-label">Reasoning</span>
                  <svg class="chevron-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="m4 6 4 4 4-4"></path></svg>
                </button>
                <div id="reasoning-menu" class="setting-menu" role="menu" aria-label="추론 수준 선택" hidden></div>
              </div>
              <button id="fast-mode-button" class="mode-button" type="button" title="Fast mode off" aria-label="Fast mode off" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 10-13h-7l1-7Z"></path></svg>
              </button>
              <button id="goal-mode-button" class="mode-button" type="button" title="Goal mode off" aria-label="Goal mode off" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg>
              </button>
              <div class="utility-picker session-picker">
                <button id="session-button" class="utility-button" type="button" title="기존 Main Agent 세션 불러오기" aria-label="기존 Main Agent 세션 불러오기" aria-haspopup="listbox" aria-expanded="false" aria-controls="session-menu">
                  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path><path d="M12 7v5l3 2"></path></svg>
                </button>
                <div id="session-menu" class="session-menu" role="listbox" aria-label="Main Agent 세션" hidden>
                  <div id="session-list" class="session-list"></div>
                </div>
              </div>
              <div class="utility-picker question-picker">
                <button id="question-button" class="utility-button" type="button" title="사용자 질문 목록" aria-label="사용자 질문 목록" aria-haspopup="listbox" aria-expanded="false" aria-controls="question-menu">
                  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="5" cy="7" r="1"></circle><circle cx="5" cy="12" r="1"></circle><circle cx="5" cy="17" r="1"></circle><path d="M9 7h10M9 12h10M9 17h10"></path></svg>
                </button>
                <div id="question-menu" class="question-menu" role="listbox" aria-label="사용자 질문" hidden>
                  <div id="question-list" class="question-list"></div>
                </div>
              </div>
            </div>
            <div class="composer-actions-end">
              <button id="send-button" class="send-button" type="button" title="전송 (Enter)" aria-label="메시지 전송">
                <svg id="send-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 19V5M6.5 10.5 12 5l5.5 5.5"></path></svg>
                <svg id="stop-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" hidden><rect x="7" y="7" width="10" height="10" rx="1"></rect></svg>
              </button>
            </div>
          </div>
        </div>
      </section>
      <div id="status-bar" class="status-bar" aria-label="Agent 상태"></div>
    </main>
    <script nonce="{{nonce}}" src="{{markdownScriptUri}}"></script>
    <script nonce="{{nonce}}" src="{{syntaxScriptUri}}"></script>
    <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
  </body>
</html>
