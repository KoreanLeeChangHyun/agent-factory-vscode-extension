<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src {{cspSource}} data: blob:; font-src {{cspSource}}; style-src {{cspSource}}; script-src 'nonce-{{nonce}}' 'wasm-unsafe-eval';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{{styleUri}}" />
    <title>Main Agent</title>
  </head>
  <body>
    <main class="chat-shell" aria-label="Main Agent chat">
      <section id="timeline" class="timeline" aria-live="polite" aria-label="Conversation">
        <div id="empty-state" class="empty-state">
          <img class="brand-mark" src="{{iconUri}}" alt="" aria-hidden="true" />
          <h1>Agent Factory</h1>
        </div>
      </section>

      <div id="drop-overlay" class="drop-overlay" hidden>
        <strong>Drop files or folders to attach</strong>
      </div>

      <section class="composer-region" aria-label="Compose message">
        <div class="composer-status-row">
          <div id="run-status" class="run-status" role="status" aria-live="polite" hidden>
            <button id="run-status-toggle" class="run-status-toggle" type="button" aria-expanded="false" aria-controls="run-details">
              <span class="run-status-pulse" aria-hidden="true"></span>
              <span class="run-status-copy">
                <span id="run-status-label" class="run-status-label"></span>
                <span class="run-status-meta" aria-hidden="true"><span id="run-elapsed">0s</span></span>
              </span>
              <span id="run-status-agents" class="run-status-agents" aria-hidden="true"></span>
              <svg class="run-status-chevron" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="m4 10 4-4 4 4"></path></svg>
            </button>
            <section id="run-details" class="run-details" aria-label="Work and verification details" hidden>
              <div class="run-details-heading">
                <strong>Work · Verification</strong>
                <span id="run-details-summary"></span>
              </div>
              <div id="run-stage-list" class="run-stage-list"></div>
              <button id="run-stop-button" class="run-stop-button" type="button">Stop current run</button>
            </section>
          </div>
          <button id="pending-queue-toggle" class="pending-queue-toggle" type="button" aria-expanded="false" aria-controls="pending-message-queue" hidden>
            <span id="pending-queue-label">Queued 0</span>
            <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="m4 6 4 4 4-4"></path></svg>
          </button>
        </div>
        <section id="pending-message-queue" aria-label="Queued messages" hidden></section>
        <div class="composer">
          <div id="attachment-list" class="attachment-list" aria-label="Attachments"></div>
          <textarea
            id="prompt"
            rows="1"
            maxlength="100000"
            placeholder="Ask Agent Factory"
            aria-label="Message to Main Agent"
          ></textarea>
          <div class="composer-actions">
            <div class="composer-actions-start">
              <button id="attach-button" class="icon-button" type="button" title="Attach files or folders" aria-label="Attach files or folders">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"></path></svg>
              </button>
              <div class="setting-control">
                <button id="model-button" class="setting-button" type="button" title="Select model" aria-label="Select model" aria-haspopup="menu" aria-expanded="false" aria-controls="model-menu">
                  <span id="model-label">Default</span>
                  <svg class="chevron-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="m4 6 4 4 4-4"></path></svg>
                </button>
                <div id="model-menu" class="setting-menu" role="menu" aria-label="Select model" hidden></div>
              </div>
              <div class="setting-control">
                <button id="reasoning-button" class="setting-button" type="button" title="Select reasoning effort" aria-label="Select reasoning effort" aria-haspopup="menu" aria-expanded="false" aria-controls="reasoning-menu">
                  <span id="reasoning-label">Default</span>
                  <svg class="chevron-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="m4 6 4 4 4-4"></path></svg>
                </button>
                <div id="reasoning-menu" class="setting-menu" role="menu" aria-label="Select reasoning effort" hidden></div>
              </div>
              <div class="setting-control">
                <button id="execution-mode-button" class="setting-button execution-mode-button" type="button" title="Permissions: Current session · Select execution permissions for the next message" aria-label="Permissions: Current session · Select execution permissions for the next message" aria-haspopup="menu" aria-expanded="false" aria-controls="execution-mode-menu">
                  <svg class="execution-mode-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3 4 6v6c0 4 4 7 8 9 4-2 8-5 8-9V6l-8-3Z"></path></svg>
                </button>
                <div id="execution-mode-menu" class="setting-menu" role="menu" aria-label="Select execution permissions" hidden></div>
              </div>
              <div class="setting-control">
                <button id="business-mode-button" class="setting-button task-mode-button" type="button" title="Workflow: Normal" aria-label="Workflow: Normal" aria-haspopup="menu" aria-expanded="false" aria-controls="business-mode-menu">
                  <svg class="task-mode-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 4h6v6H4Zm10 0h6v6h-6ZM4 14h6v6H4Zm10 0h6v6h-6Z"></path></svg>
                </button>
                <div id="business-mode-menu" class="setting-menu" role="menu" aria-label="Select workflow" hidden></div>
              </div>
              <div class="setting-control">
                <button id="work-loop-button" class="setting-button task-mode-button" type="button" title="Task mode: Work · Select the mode for the next message" aria-label="Task mode: Work · Select the mode for the next message" aria-haspopup="menu" aria-expanded="false" aria-controls="task-mode-menu">
                  <svg class="task-mode-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14 6a5 5 0 0 0-6 6L3 17a2.8 2.8 0 0 0 4 4l5-5a5 5 0 0 0 6-6l-3 3-4-4 3-3Z"></path></svg>
                </button>
                <div id="task-mode-menu" class="setting-menu" role="menu" aria-label="Select task mode" hidden></div>
              </div>
              <button id="fast-mode-button" class="mode-button" type="button" title="Fast mode off" aria-label="Fast mode off" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 10-13h-7l1-7Z"></path></svg>
              </button>
              <button id="goal-mode-button" class="mode-button" type="button" title="Goal mode off" aria-label="Goal mode off" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg>
              </button>
              <div class="utility-picker session-picker">
                <div id="session-menu" class="utility-list-menu session-menu" role="listbox" aria-label="Main Agent sessions" hidden>
                  <div id="session-list" class="session-list"></div>
                </div>
              </div>
              <button id="auto-scroll-button" class="mode-button" type="button" title="Auto-scroll ON · Click to turn off" aria-label="Auto-scroll ON · Click to turn off" aria-pressed="true" aria-controls="timeline">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 5h8M4 10h6M4 15h8M17 3v17m-4-4 4 4 4-4"></path></svg>
              </button>
              <div class="utility-picker question-picker">
                <button id="question-button" class="utility-button" type="button" title="User questions" aria-label="User questions" aria-haspopup="listbox" aria-expanded="false" aria-controls="question-menu">
                  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="5" cy="7" r="1"></circle><circle cx="5" cy="12" r="1"></circle><circle cx="5" cy="17" r="1"></circle><path d="M9 7h10M9 12h10M9 17h10"></path></svg>
                </button>
                <div id="question-menu" class="utility-list-menu question-menu" role="listbox" aria-label="User questions" hidden>
                  <div id="question-list" class="question-list"></div>
                </div>
              </div>
            </div>
            <div class="composer-actions-end">
              <button id="send-button" class="send-button" type="button" title="Send (Enter)" aria-label="Send message">
                <svg id="send-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 19V5M6.5 10.5 12 5l5.5 5.5"></path></svg>
                <svg id="stop-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" hidden><rect x="7" y="7" width="10" height="10" rx="1"></rect></svg>
              </button>
            </div>
          </div>
        </div>
      </section>
      <section id="goal-panel" class="goal-panel" aria-label="Ongoing goal" hidden>
        <p id="goal-status" role="status" aria-live="polite"></p>
        <div class="goal-actions">
          <button type="button" data-goal-action="refresh">Refresh status</button>
          <button type="button" data-goal-action="pause">Pause</button>
          <button type="button" data-goal-action="reopen">Resume</button>
          <button type="button" data-goal-action="cancel">Cancel goal</button>
          <button type="button" data-goal-action="disable">Turn off Goal</button>
        </div>
      </section>
      <div id="agents-menu" class="utility-list-menu agents-menu" role="listbox" aria-label="Called work and verification agents" hidden>
        <div id="agents-list" class="agents-list"></div>
      </div>
      <section id="status-settings" class="status-settings" aria-label="Status bar settings" hidden>
        <div class="status-settings-heading"><strong>Status bar</strong><button id="status-settings-close" type="button" aria-label="Close status bar settings" title="Close"><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="m4 4 8 8M12 4l-8 8"></path></svg></button></div>
        <p class="status-settings-hint">Select items to display · Drag or use arrows to reorder</p>
        <div id="status-catalog" class="status-catalog"></div>
        <div class="status-settings-footer"><span tabindex="0" title="The current connection does not provide costs, remaining credits, limit resets, short-term limits, account-wide tokens, input/output/cache breakdowns, or processing speed.">Some metrics are unavailable</span><button id="status-reset" type="button">Restore defaults</button></div>
        <span id="status-announcement" role="status" aria-live="polite"></span>
      </section>
      <div class="status-footer">
        <div id="status-bar" class="status-bar" aria-label="Agent status"></div>
        <button id="status-settings-button" class="status-settings-button" type="button" aria-controls="status-settings" aria-expanded="false" aria-label="Status bar settings" title="Status bar settings">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
            <path d="m9 3-.5 3-2 1.2L3.7 6l-3 5 2.3 2v2l-2.3 2 3 5 2.8-1.2 2 1.2.5 3h6l.5-3 2-1.2 2.8 1.2 3-5-2.3-2v-2l2.3-2-3-5-2.8 1.2-2-1.2L15 3Z" transform="translate(2 0) scale(.83)" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>
      </div>
    </main>
    <script nonce="{{nonce}}" src="{{markdownScriptUri}}"></script>
    <script nonce="{{nonce}}" src="{{syntaxScriptUri}}"></script>
    <script nonce="{{nonce}}" src="{{ansiScriptUri}}"></script>
    <script nonce="{{nonce}}" src="{{executionReferencesScriptUri}}"></script>
    <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
  </body>
</html>
